<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Salty Dog</title>
  <meta name="description" content="Sailing charter companion">

  <!-- PWA meta -->
  <meta name="theme-color" content="#506300">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Salty Dog">
  <link rel="manifest" href="/manifest.json">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

  <!-- Google Fonts: Plus Jakarta Sans (headlines) + Manrope (body/labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">

  <!-- App CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/templates.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header" id="app-header">
    <div class="header-content">
      <h1 class="header-title" id="header-title">Salty Dog</h1>
      <p class="header-subtitle" id="header-subtitle"></p>
    </div>
    <div class="header-status">
      <span class="status-dot" id="status-dot" title="Online"></span>
    </div>
  </header>

  <!-- Main content area -->
  <main class="app-content" id="app-content">

    <!-- Loading state -->
    <div class="loading-screen" id="loading-screen">
      <div class="loading-spinner"></div>
      <p class="loading-text">Loading...</p>
    </div>

    <!-- Error state -->
    <div class="error-screen hidden" id="error-screen">
      <div class="error-icon"><span class="material-symbols-outlined" style="font-size: 3rem;">emergency</span></div>
      <h2>Oops!</h2>
      <p id="error-message">Could not load content</p>
      <button class="btn-retry" id="btn-retry" type="button">Retry</button>
    </div>

    <!-- Map tab -->
    <div class="tab-panel" id="tab-map" role="tabpanel" aria-labelledby="btn-tab-map">
      <div class="map-container" id="map-container"></div>
      <div class="tab-content" id="map-content"></div>
    </div>

    <!-- Plan tab -->
    <div class="tab-panel hidden" id="tab-plan" role="tabpanel" aria-labelledby="btn-tab-plan">
      <div class="tab-content" id="plan-content"></div>
    </div>

    <!-- Tips tab -->
    <div class="tab-panel hidden" id="tab-tips" role="tabpanel" aria-labelledby="btn-tab-tips">
      <div class="tab-content" id="tips-content"></div>
    </div>

    <!-- Crew tab -->
    <div class="tab-panel hidden" id="tab-crew" role="tabpanel" aria-labelledby="btn-tab-crew">
      <div class="tab-content" id="crew-content"></div>
    </div>

  </main>

  <!-- Bottom tab bar -->
  <nav class="tab-bar" id="tab-bar" role="tablist">
    <button class="tab-btn active" id="btn-tab-map" role="tab" aria-selected="true"
            aria-controls="tab-map" data-tab="map" type="button">
      <span class="tab-icon"><span class="material-symbols-outlined">explore</span></span>
      <span class="tab-label">Маршрут</span>
    </button>
    <button class="tab-btn" id="btn-tab-plan" role="tab" aria-selected="false"
            aria-controls="tab-plan" data-tab="plan" type="button">
      <span class="tab-icon"><span class="material-symbols-outlined">map</span></span>
      <span class="tab-label">&#x41F;&#x43B;&#x430;&#x43D;</span>
    </button>
    <button class="tab-btn" id="btn-tab-tips" role="tab" aria-selected="false"
            aria-controls="tab-tips" data-tab="tips" type="button">
      <span class="tab-icon"><span class="material-symbols-outlined">emergency</span></span>
      <span class="tab-label">FYI</span>
    </button>
    <button class="tab-btn" id="btn-tab-crew" role="tab" aria-selected="false"
            aria-controls="tab-crew" data-tab="crew" type="button">
      <span class="tab-icon"><span class="material-symbols-outlined">group</span></span>
      <span class="tab-label">Сборы</span>
    </button>
  </nav>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <!-- App JS (order matters: content first, then map, then templates, then app) -->
  <script src="/static/js/content.js"></script>
  <script src="/static/js/map.js"></script>
  <script src="/static/js/templates.js"></script>
  <script src="/static/js/app.js"></script>

  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      // SW must be served from root scope for full caching.
      // Try root first (requires backend route), fall back to /static/.
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function() {
          return navigator.serviceWorker.register('/static/sw.js', { scope: '/static/' });
        })
        .then(function(reg) {
          if (reg) console.log('SW registered, scope:', reg.scope);
        })
        .catch(function(err) {
          console.warn('SW registration failed:', err);
        });
    }
  </script>

</body>
</html>
